# The exact toolchain this repo builds and gates with.
#
# PINNED DELIBERATELY. This file used to say `channel = "stable"`, so CI
# followed whatever stable happened to be that day — and on 2026-08-23 stable
# moved 1.96 -> 1.98, which added a clippy lint that pre-existing code tripped.
# `main` went red on its own, with no change from anyone, and every open PR was
# blocked until it was fixed. A pin turns that surprise into a decision.
#
# To bump: raise `channel` here, run the full gates
# (`cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D
# warnings`, `cargo test --workspace`), fix whatever the new lints flag, and
# land it as its own PR. Note this is NOT the MSRV — that is `rust-version` in
# the workspace Cargo.toml, and it is deliberately older.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
