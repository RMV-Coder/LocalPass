name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Doc (warnings are errors)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace advertises `rust-version` (the MSRV) in Cargo.toml, which is
  # deliberately older than the toolchain rust-toolchain.toml pins to build
  # with. Nothing enforced that promise, so it could rot silently the first
  # time someone used a newer API. This checks it for real.
  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read the MSRV from the manifest rather than repeating it here: a second
      # copy would drift from the first, which is the exact failure mode the
      # toolchain pin was added to prevent.
      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          test -n "$v" || { echo "no rust-version found in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # rust-toolchain.toml pins the BUILD toolchain and takes precedence over
      # the one just installed. RUSTUP_TOOLCHAIN outranks that directory
      # override, so the check genuinely runs on the MSRV — without it this job
      # would silently re-test the pinned compiler and always pass.
      - name: cargo check on the MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --all-features --locked

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
