# Publish a GitHub release for the app whenever a new app version lands on
# main: build the Windows bundle (MSI + NSIS) and the signed Android APK and
# attach them under a `desktop-v<version>` tag (the tag prefix is historical;
# the release covers every platform the app ships on). With the updater key in
# the repo secrets it also publishes the signed `latest.json` feed the in-app
# "Check for updates" reads, and with SignPath configured the Windows installers
# are code signed first (CODE_SIGNING.md).
#
# Trigger model: `npm run bundle` (or bundle:minor / bundle:major) bumps the
# version locally; the bump merges through a PR like any other change; this
# workflow notices the new version on main, builds it, and tags + releases it.
# One release per version — a push that does not change the version (or a
# version whose tag already exists) is skipped, so ordinary desktop work never
# spams releases.

name: App release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"

permissions:
  contents: write
  # SignPath's action reads the uploaded (unsigned) workflow artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Tag + release the bundled version
    runs-on: windows-latest
    outputs:
      new: ${{ steps.gate.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to decide whether this version is released

      - name: Read the app version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=desktop-v$v" >> $env:GITHUB_OUTPUT

      - name: Skip if this version is already released
        id: gate
        shell: pwsh
        run: |
          git fetch --tags --quiet
          $exists = git tag --list "${{ steps.version.outputs.tag }}"
          if ($exists) { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.new == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.new == 'true'
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.new == 'true'
        with:
          node-version: 22

      # With the updater signing key present, the build also writes a minisign
      # signature next to each installer (<installer>.sig) for the in-app
      # updater (apps/desktop/src-tauri/src/updates.rs). Without it the release
      # is built exactly as before and the app just finds no update feed.
      # Secrets: TAURI_SIGNING_PRIVATE_KEY (the key file's contents) and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the public half is in tauri.conf.json.
      - name: Build the bundle (no version bump in CI)
        if: steps.gate.outputs.new == 'true'
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run bundle:nobump -- --config "$PWD/src-tauri/tauri.updater.conf.json"
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures"
            npm run bundle:nobump
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Windows code signing (CODE_SIGNING.md) ----------------------------
      # With SignPath configured, the installers are signed before release:
      # the MSI is deep-signed (localpass-desktop.exe and localpass-daemon.exe
      # inside it, then the MSI itself) and the NSIS installer is signed as a
      # whole (.signpath/artifact-configurations/windows-installers.xml). Every
      # request waits for a person to approve it in SignPath, a SignPath
      # Foundation rule, so this job pauses until then (up to two hours).
      # Without the configuration the release is unsigned, exactly as before.
      #   secret   SIGNPATH_API_TOKEN            (submitter token)
      #   variable SIGNPATH_ORGANIZATION_ID
      #   variable SIGNPATH_PROJECT_SLUG          (default: LocalPass)
      #   variable SIGNPATH_SIGNING_POLICY_SLUG   (default: release-signing)
      - name: Check the code-signing setup
        id: codesign
        if: steps.gate.outputs.new == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "SignPath is not configured: the Windows installers stay unsigned"
          }

      - name: Stage the unsigned installers
        if: steps.codesign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force signing/unsigned | Out-Null
          Copy-Item "$bundle/msi/*.msi", "$bundle/nsis/*-setup.exe" signing/unsigned/
          $files = @(Get-ChildItem signing/unsigned -File)
          if ($files.Count -ne 2) { throw "expected one MSI and one NSIS installer, found $($files.Count) files" }
          $files | Format-Table Name, Length

      - name: Upload the unsigned installers for signing
        id: unsigned
        if: steps.codesign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: signing/unsigned/
          retention-days: 1
          if-no-files-found: error

      - name: Sign with SignPath (waits for approval)
        if: steps.codesign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'LocalPass' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      # Verify before anything is published: both installers, and the two
      # executables inside the MSI (unpacked with an administrative install),
      # must carry a valid Authenticode signature. Then the signed files
      # replace the unsigned ones, and the updater's minisign signatures are
      # made again over the SIGNED bytes (code signing changed the files, so
      # the ones the build wrote would no longer verify).
      - name: Verify and use the signed installers
        if: steps.codesign.outputs.enabled == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          function Assert-Signed($path) {
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid') { throw "$(Split-Path $path -Leaf): signature status is $($sig.Status)" }
            Write-Host "$(Split-Path $path -Leaf): signed by $($sig.SignerCertificate.Subject)"
          }
          $bundle = (Resolve-Path "apps/desktop/src-tauri/target/release/bundle").Path
          $signed = @(Get-ChildItem signing/signed -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' })
          if ($signed.Count -ne 2) { throw "expected two signed installers back from SignPath, got $($signed.Count)" }

          $placed = @()
          foreach ($f in $signed) {
            Assert-Signed $f.FullName
            $dir = if ($f.Extension -eq '.msi') { "$bundle/msi" } else { "$bundle/nsis" }
            $dest = Join-Path $dir $f.Name
            if (-not (Test-Path $dest)) { throw "SignPath returned $($f.Name), which the build did not produce" }
            Copy-Item $f.FullName $dest -Force
            $placed += $dest
          }

          $msi = @($placed | Where-Object { $_ -like '*.msi' })[0]
          $unpacked = Join-Path $env:RUNNER_TEMP "msi-contents"
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$unpacked`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "could not unpack the signed MSI (msiexec exit $($p.ExitCode))" }
          foreach ($exe in 'localpass-desktop.exe', 'localpass-daemon.exe') {
            $found = @(Get-ChildItem $unpacked -Recurse -File -Filter $exe)
            if ($found.Count -ne 1) { throw "expected one $exe inside the MSI, found $($found.Count)" }
            Assert-Signed $found[0].FullName
          }

          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Push-Location apps/desktop
            foreach ($f in $placed) {
              npx tauri signer sign "$f"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Pop-Location
          }

      - name: Tag and create the release
        if: steps.gate.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git tag $tag ${{ github.sha }}
          git push origin $tag
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          $assets = $msi + $nsis
          if ($assets.Count -eq 0) { throw "no installer artifacts found under $bundle" }
          $sigs = @($assets | ForEach-Object { "$($_.FullName).sig" } | Where-Object { Test-Path $_ })
          $extraNotes = @()
          if ("${{ steps.codesign.outputs.enabled }}" -eq "true") {
            # The download page links the code signing policy (SignPath
            # Foundation requirement); prepended to the generated notes.
            $extraNotes = @("--notes", "**Code signing policy:** the Windows installers are signed. Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). See [CODE_SIGNING.md](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md).")
          }
          gh release create $tag @($assets.FullName + $sigs) `
            --title "LocalPass v${{ steps.version.outputs.version }}" `
            --generate-notes @extraNotes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The in-app updater's feed (releases/latest/download/latest.json).
          # Only when the installers were signed: an unsigned feed would be
          # rejected by every app anyway. The app installed from the MSI looks
          # up "windows-x86_64-msi" first, the NSIS one "windows-x86_64-nsis".
          if ($sigs.Count -gt 0) {
            $notes = (gh release view $tag --json body --jq .body) -join "`n"
            $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
            function Entry($file) {
              [ordered]@{
                signature = (Get-Content "$($file.FullName).sig" -Raw).Trim()
                url = "$base/$([uri]::EscapeDataString($file.Name))"
              }
            }
            $platforms = [ordered]@{}
            if ($msi.Count -eq 1 -and (Test-Path "$($msi[0].FullName).sig")) {
              $platforms["windows-x86_64-msi"] = Entry $msi[0]
              $platforms["windows-x86_64"] = Entry $msi[0]
            }
            if ($nsis.Count -eq 1 -and (Test-Path "$($nsis[0].FullName).sig")) {
              $platforms["windows-x86_64-nsis"] = Entry $nsis[0]
            }
            $feed = [ordered]@{
              version = "${{ steps.version.outputs.version }}"
              notes = $notes
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = $platforms
            }
            $feed | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json
            gh release upload $tag latest.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Build, sign, and attach the Android APK to the same release. Signing uses
  # the dedicated RELEASE keystore from repo secrets (ANDROID_KEYSTORE_B64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) — NOT the debug keystore, so
  # a device that still runs a debug-signed build needs one uninstall/reinstall
  # when first moving to a released APK (signature change; see docs/android.md).
  # If the secrets are absent the job skips quietly rather than failing the
  # desktop release.
  android:
    name: Android APK
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; echo "signing secrets not set; skipping the Android build"; fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.have == 'true'
      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.have == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.have == 'true'
      # The target must be added to the toolchain cargo will actually use — the
      # one rust-toolchain.toml pins — not to whatever `@stable` installed. Run
      # inside the repo so rustup applies the directory override.
      - name: Add the Android target to the pinned toolchain
        if: steps.secrets.outputs.have == 'true'
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.secrets.outputs.have == 'true'
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install Android SDK pieces
        if: steps.secrets.outputs.have == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the release APK (aarch64)
        if: steps.secrets.outputs.have == 'true'
        working-directory: apps/desktop
        run: |
          npm ci
          # gen/android is gitignored, so init from scratch and regenerate the
          # icons afterwards (tauri icon's android output does not persist).
          # The manifest supplies the adaptive-icon layers (brass background,
          # keyhole foreground, monochrome themed icon); see DESIGN.md.
          npx tauri android init
          npx tauri icon brand/icon-manifest.json
          npx tauri android build --apk --target aarch64

      - name: Sign the APK with the release keystore
        if: steps.secrets.outputs.have == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned=$(find apps/desktop/src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          if [ -z "$unsigned" ]; then echo "no unsigned release APK found"; find apps/desktop/src-tauri/gen/android -name "*.apk"; exit 1; fi
          tools="$ANDROID_HOME/build-tools/34.0.0"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.keystore
          out="LocalPass_${{ needs.release.outputs.version }}_aarch64.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$out" aligned.apk
          "$tools/apksigner" verify "$out"
          rm -f release.keystore aligned.apk
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Attach the APK to the release
        if: steps.secrets.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "$APK"
